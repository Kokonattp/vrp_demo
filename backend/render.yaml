services:
  - type: web
    name: vrp-simulation-studio-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OSRM_BASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
